# SeoSeo — self-hosted stack.
#   cp .env.example .env   # then edit secrets
#   docker compose -f deploy/compose.yaml --env-file .env up -d --build
# Open http://localhost:3000 — the first account you create becomes the admin.

name: seoseo

x-backend: &backend
  build:
    context: ../backend
  image: ${SEOSEO_BACKEND_IMAGE:-seoseo-backend:local}
  restart: unless-stopped
  environment: &backend-env
    DATABASE_URL: postgres://${POSTGRES_USER:-seoseo}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-seoseo}
    VALKEY_URL: redis://cache:6379
    WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
    AUTH_MODE: ${AUTH_MODE:-password}
    ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    RUST_LOG: ${RUST_LOG:-info}
    LOG_FORMAT: json
    APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
    SEARXNG_URL: ${SEARXNG_URL:-}
    RENDERER_URL: ${RENDERER_URL:-}

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seoseo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-seoseo}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seoseo} -d ${POSTGRES_DB:-seoseo}"]
      interval: 5s
      timeout: 5s
      retries: 20

  cache:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend
    restart: "no"
    command: ["migrate"]
    depends_on:
      db:
        condition: service_healthy

  api:
    networks: [default, browser]
    <<: *backend
    command: ["serve"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      cache:
        condition: service_healthy
    healthcheck:
      # distroless has no shell/curl; the binary checks its own readiness endpoint.
      disable: true

  worker:
    networks: [default, browser]
    <<: *backend
    command: ["worker"]
    environment:
      <<: *backend-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-8}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ../frontend
    image: ${SEOSEO_WEB_IMAGE:-seoseo-web:local}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8080
      AUTH_MODE: ${AUTH_MODE:-password}
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      - api

  # Optional free SERP source. Enable with `--profile serp` and SEARXNG_URL=http://searxng:8080.
  searxng:
    image: searxng/searxng:latest
    profiles: ["serp"]
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-searxng}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

  renderer:
    build: ../renderer
    profiles: ["renderer"]
    restart: unless-stopped
    networks: [browser]
    shm_size: 256mb
    mem_limit: 2g
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [renderer-proxy]
  renderer-proxy:
    build: ../renderer
    profiles: ["renderer"]
    command: ["node", "proxy.mjs"]
    restart: unless-stopped
    networks: [browser, egress]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  browser:
    internal: true
  egress:

volumes:
  pgdata:
  valkeydata:
