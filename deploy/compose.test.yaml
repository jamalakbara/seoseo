# Test overlay: adds the deliberately broken `badseo` site and lets the crawler reach it.
#   docker compose -f deploy/compose.yaml -f deploy/compose.test.yaml --env-file .env up -d --build
# Never use this overlay in production: CRAWLER_ALLOW_PRIVATE disables the SSRF guard.
services:
  badseo:
    image: nginx:1-alpine
    volumes:
      - ./test/badseo/site:/usr/share/nginx/html:ro
      - ./test/badseo/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  api:
    environment:
      CRAWLER_ALLOW_PRIVATE: "true"
      SEARXNG_URL: ${TEST_SEARXNG_URL:-http://badseo}
      RENDERER_URL: http://renderer:8080
  worker:
    environment:
      CRAWLER_ALLOW_PRIVATE: "true"
      SEARXNG_URL: ${TEST_SEARXNG_URL:-http://badseo}
      RENDERER_URL: http://renderer:8080
      WORKER_CONCURRENCY: "8"

  renderer-proxy:
    environment:
      RENDERER_ALLOW_PRIVATE: "true"
    networks: [browser, egress, default]
