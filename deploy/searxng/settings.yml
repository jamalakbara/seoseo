# SearXNG for SeoSeo: internal-only meta search used for SERP analysis.
# The JSON format must stay enabled; SeoSeo reads results through it.
use_default_settings: true

general:
  instance_name: "SeoSeo SearXNG"

search:
  safe_search: 0
  formats:
    - html
    - json

server:
  # Overwritten by SEARXNG_SECRET.
  secret_key: "change-me"
  # Not exposed outside the compose network, so the public-instance bot limiter is off.
  limiter: false
  image_proxy: false
