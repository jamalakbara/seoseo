events {}
http {
  log_format lookup '$host $request_uri';
  access_log /dev/stdout lookup;
  server {
    listen 80;
    server_name _;
    location = /robots.txt {
      default_type text/plain;
      if ($host = robots.tech-fixture.example) { return 200 "User-agent: SeoSeoBot\nDisallow: /\n"; }
      if ($host = robotblock.tech-fixture.example) { return 403; }
      return 200 "User-agent: SeoSeoBot\nAllow: /\n";
    }
    location = / {
      default_type text/html;
      if ($host = bot.tech-fixture.example) { return 200 '<html><title>Just a moment</title><script src="/_next/static/a.js"></script></html>'; }
      if ($host = redirect.tech-fixture.example) { return 302 http://good.tech-fixture.example/; }
      return 200 '<html><head><meta name="generator" content="WordPress 6"><script src="/_next/static/a.js"></script><link rel="stylesheet" href="https://cdn.shopify.com/a.css"></head><body><h1>Synthetic technology fixture</h1></body></html>';
    }
  }
}
