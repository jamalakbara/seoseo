server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  location = /search {
    default_type application/json;
    return 200 '{"results":[{"url":"https://example.com/one","title":"One","content":"First result"},{"url":"https://wikipedia.org/two","title":"Two"},{"url":"https://example.org/three","title":"Three"},{"url":"https://example.net/four","title":"Four"},{"url":"https://rust-lang.org/five","title":"Five"}],"suggestions":["related fixture keyword"],"answers":[]}';
  }
  location = /old-page   { return 301 /older-page; }
  location = /older-page { return 301 /about.html; }
  location = /loop-a     { return 302 /loop-b; }
  location = /loop-b     { return 302 /loop-a; }
  location = /server-error { return 500; }
  location = /forbidden  { return 403; }
  location = /header-canonical.html {
    add_header Link '<http://badseo/somewhere-else.html>; rel="canonical"';
  }
  location = /x-robots.html { add_header X-Robots-Tag "noindex"; }
}
