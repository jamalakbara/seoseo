[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
# internal
common = { path = "crates/common" }
db = { path = "crates/db" }
domain = { path = "crates/domain" }
jobs = { path = "crates/jobs" }
api = { path = "crates/api" }

# runtime / web
tokio = { version = "1.54", features = ["full"] }
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "trace", "compression-full", "timeout", "limit", "request-id", "util"] }

# data
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "json", "migrate", "derive", "macros"] }
redis = { version = "1.8", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.29", features = ["v7", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }

# openapi
utoipa = { version = "6.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = "0.3"
utoipa-scalar = { version = "0.4", features = ["axum"] }

# security
argon2 = { version = "0.6", features = ["getrandom"] }
getrandom = "0.4"
sha2 = "0.11"
hex = "0.4"
base64 = "0.23"

# infra
clap = { version = "4.6", features = ["derive", "env"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
thiserror = "2.0"
anyhow = "1.0"
dotenvy = "0.15"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
