<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; base-uri 'none'; form-action 'none'"><title>SeoSeo evidence</title><style>body{font:14px system-ui,sans-serif;padding:20px;color:#172b32;background:#f7faf9}input,button{font:inherit;padding:8px;border:1px solid #abc;border-radius:6px}table{border-collapse:collapse;width:100%;margin-top:16px}td,th{text-align:left;padding:10px;border-bottom:1px solid #cdd;overflow-wrap:anywhere}p{color:#456}h1{font-size:21px}a{color:#056}</style></head><body><h1>SeoSeo evidence</h1><p id="source">Waiting for tool results…</p><label>Filter rows <input id="filter" type="search"></label> <button id="sort">Reverse order</button><div style="overflow-x:auto"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div><p id="note"></p><script>
let rows=[],kind='serp',parentOrigin=null;const text=(id,v)=>document.getElementById(id).textContent=v;
function render(){const head=document.getElementById('head');head.replaceChildren();const tr=document.createElement('tr');for(const label of kind==='serp'?['Position','Title','URL','SR']:['Dimensions','Clicks','Impressions','CTR','Position']){const th=document.createElement('th');th.textContent=label;tr.append(th)}head.append(tr);const body=document.getElementById('rows');body.replaceChildren();const q=document.getElementById('filter').value.toLowerCase();for(const row of rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q)).slice(0,100)){const tr=document.createElement('tr');const values=kind==='serp'?[row.position,row.title,row.url,row.sr]:[(row.keys||[]).join(' / '),row.clicks,row.impressions,row.ctr,row.position];for(const value of values){const td=document.createElement('td');td.textContent=value==null?'Unknown':String(value);tr.append(td)}body.append(tr)}}
addEventListener('message',e=>{if(e.source!==parent||!e.data||e.data.jsonrpc!=='2.0')return;if(parentOrigin&&e.origin!==parentOrigin)return;const m=e.data;if(m.id===1&&m.result){parentOrigin=e.origin;parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'},parentOrigin==='null'?'*':parentOrigin)}if(m.method==='ui/notifications/tool-result'){let data=m.params?.structuredContent;if(!data){try{data=JSON.parse(m.params?.content?.find(c=>c.type==='text')?.text||'{}')}catch{return}}if(data?.data)data=data.data;if(data?.ok===false){text('source','Unable to load evidence');return}kind=Array.isArray(data?.items)?'serp':'gsc';rows=(kind==='serp'?data?.items:data?.rows)||[];text('source',kind==='serp'?`${data.provider} · ${data.country}/${data.language} · ${data.exact?'engine positions':'blended results'}`:`Search Console · ${data?.site_url||''}`);text('note',data?.note||'Observed sample only. Unknown metrics are not zero.');render()}if(m.method==='ui/notifications/tool-cancelled')text('source','Tool cancelled')});
document.getElementById('filter').addEventListener('input',render);document.getElementById('sort').addEventListener('click',()=>{rows.reverse();render()});parent.postMessage({jsonrpc:'2.0',id:1,method:'ui/initialize',params:{appInfo:{name:'SeoSeo evidence',version:'1.0.0'},appCapabilities:{},protocolVersion:'2026-01-26'}},'*');
</script></body></html>
